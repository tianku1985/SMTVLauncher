name: Build LejiaLauncher APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      donotpublish:
        description: '构建后不发布 Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lejiadesk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;28.0.3"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-lejia-${{ runner.os }}-${{ hashFiles('src/**/*.gradle', 'src/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-lejia-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Build LejiaLauncher release APK
        env:
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g'
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :lejia:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report build failure
        if: failure()
        run: |
          block="$(sed -n '/What went wrong/,/^\* Try/p' gradle-build.log | head -n 40)"
          if [ -z "$block" ]; then block="$(tail -n 80 gradle-build.log)"; fi
          errs="$(grep -E 'error:|错误' gradle-build.log | head -n 15)"
          block="${block}"$'\n'"${errs}"
          block="${block//'%'/'%25'}"
          block="${block//$'\r'/}"
          block="${block//$'\n'/'%0A'}"
          echo "::error::${block}"

      - name: Sign APK
        env:
          KEYSTORE_FILE: shenmatv.jks
          KEYSTORE_PASSWORD: uw3GlHbAkA9V
          KEY_ALIAS: key0
          KEY_PASSWORD: iRG81BV3jS1h
        run: |
          set -e
          APK="$(find lejia/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned*' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find lejia/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          fi
          if [ -z "$APK" ]; then
            echo "未找到 release APK"
            find lejia/build/outputs -name '*.apk' -print || true
            exit 1
          fi

          VERSION="$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          BT="$ANDROID_SDK_ROOT/build-tools/28.0.3"
          mkdir -p ../dist
          "$BT/zipalign" -f -p 4 "$APK" ../dist/aligned.apk
          "$BT/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "../dist/LejiaLauncher-${VERSION}.apk" \
            ../dist/aligned.apk
          "$BT/apksigner" verify --verbose "../dist/LejiaLauncher-${VERSION}.apk"
          cp -f "../dist/LejiaLauncher-${VERSION}.apk" ../dist/LejiaLauncher-latest.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LejiaLauncher-${{ env.VERSION }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish latest release
        if: ${{ github.event_name != 'pull_request' && inputs.donotpublish != true }}
        uses: ncipollo/release-action@v1
        with:
          name: LejiaLauncher-latest
          tag: LejiaLauncher-latest
          allowUpdates: true
          removeArtifacts: true
          artifacts: dist/*.apk
